# ==============================================================================
# Nginx Configuration — VPS Multivus (vps.multivus.com.br)
# Reverse Proxy, SSL Let's Encrypt / Cloudflare, SSE Streaming & Security
# ==============================================================================

upstream vps_multivus_frontend {
    server 127.0.0.1:3060;
    keepalive 32;
}

upstream vps_multivus_backend {
    server 127.0.0.1:3050;
    keepalive 32;
}

# HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name vps.multivus.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps.multivus.com.br;

    # SSL Certificates (managed by Certbot or Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/vps.multivus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.multivus.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    client_max_body_size 20M;

    # API Proxy
    location /api/ {
        proxy_pass http://vps_multivus_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Server-Sent Events (SSE) Live Metrics Stream
    location /events {
        proxy_pass http://vps_multivus_backend/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 24h;
    }

    # Frontend UI
    location / {
        proxy_pass http://vps_multivus_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
